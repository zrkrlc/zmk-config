# ZMK Studio (real-time keymap editing)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# Enable OLED display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10

# Set Bluetooth TX power to maximum (+8 dBm) for reduced latency
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable modifiers to make room for WPM widget
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

# Central (left): WPM Speedometer
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n

# Peripheral (right): Gem animation (disable default cat)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y

# Split link hardening (2026-09-04): episodes of 0.15–0.55 s packet loss on a live link.
# Queues sized so a stall no longer drops keys; 1M PHY tolerates loss better than 2M.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=40
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=40
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
